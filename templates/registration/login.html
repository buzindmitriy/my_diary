{% extends "base.html" %}
{% load crispy_forms_tags %}


{% block content %}
<h2>Вход</h2>

  {% csrf_token %}
  {{ form|crispy }}

</form>
<p>Нет аккаунта? <a href="{% url 'register' %}">Зарегистрируйтесь</a></p>
{% endblock %}
